name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: AutoToques
          path: app/build/outputs/apk/release/*.apk

      - name: Publicar en Releases (para bajarlo fácil desde el celular)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk AutoToques.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest AutoToques.apk \
            --target "${{ github.sha }}" \
            --title "AutoToques (última versión)" \
            --notes "Compilado automáticamente desde ${{ github.sha }}"
